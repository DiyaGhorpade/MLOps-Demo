<!DOCTYPE html>
<html>

<head>

    <title>Iris ML Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .input-box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ccc;
        }

    </style>

</head>

<body>

    <h1>🌱 Iris Flower Prediction</h1>

    <form method="POST">

        <div class="input-box">
            <label>Sepal Length</label>
            <input
                type="number"
                step="0.1"
                name="sepal_length"
                value="5.1"
                required
            >
        </div>

        <div class="input-box">
            <label>Sepal Width</label>
            <input
                type="number"
                step="0.1"
                name="sepal_width"
                value="3.5"
                required
            >
        </div>

        <div class="input-box">
            <label>Petal Length</label>
            <input
                type="number"
                step="0.1"
                name="petal_length"
                value="1.4"
                required
            >
        </div>

        <div class="input-box">
            <label>Petal Width</label>
            <input
                type="number"
                step="0.1"
                name="petal_width"
                value="0.2"
                required
            >
        </div>

        <button type="submit">
            Predict
        </button>

    </form>


    {% if prediction %}

    <div class="result">

        <h2>Prediction: {{ prediction }}</h2>

        <p>
            Setosa probability:
            {{ "%.2f"|format(probabilities[0] * 100) }}%
        </p>

        <p>
            Versicolor probability:
            {{ "%.2f"|format(probabilities[1] * 100) }}%
        </p>

        <p>
            Virginica probability:
            {{ "%.2f"|format(probabilities[2] * 100) }}%
        </p>

    </div>

    {% endif %}

</body>

</html>
